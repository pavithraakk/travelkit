<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelKit</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="page">
        <h4>TravelKit</h4>
        <input type="text" id="currentLocation" class="user" name="currentLocation" placeholder="Current Location">
        <span id="current-error" class="error"></span>
        <input type="text" id="destination" class="user" name="destination" placeholder="Destination">
        <span id="destination-error" class="error"></span>
        <button type="submit" id="continue-btn">Continue</button>
    </div>
   <script src="home.js"></script>
</body>
</html>
